name: DoNothing Main
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.TestTask.DoNothing/**'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: main
      os: all
      workdir: Frends.TestTask.DoNothing
      env_var_names: "FOO,BAR"
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      env_vars: ${{ toJSON(secrets) }}