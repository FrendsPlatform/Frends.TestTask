name: DoNothing Test

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Frends.TestTask.DoNothing/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/collective_build.yml@822526cbb13e65bc34469e2301d691a1774ebe58
    with:
      os: lin
      dotnet_version: 6.0.x
      workdir: Frends.TestTask.DoNothing
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      test_feed_api_key: ${{ secrets.TASKS_TEST_FEED_API_KEY }}